<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата успешна - Parser SaaS</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .success-container {
            max-width: 600px;
            margin: 150px auto;
            padding: 40px;
            text-align: center;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .success-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            animation: pulse 2s infinite;
        }
        .success-icon svg {
            width: 50px;
            height: 50px;
            fill: white;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .success-title {
            font-size: 2rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 15px;
        }
        .success-text {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .next-steps {
            background: #f0fdf4;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            text-align: left;
        }
        .next-steps h3 {
            color: #16a34a;
            margin-bottom: 15px;
        }
        .next-steps ol {
            color: #555;
            line-height: 1.8;
            margin: 0;
            padding-left: 20px;
        }
        .telegram-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #0088cc;
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }
        .telegram-btn:hover {
            background: #006699;
            transform: translateY(-2px);
        }
        .telegram-btn svg {
            width: 24px;
            height: 24px;
            fill: white;
        }
        .home-link {
            display: block;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
        }
        .home-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="success-container">
        <div class="success-icon">
            <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        </div>

        <h1 class="success-title">Оплата прошла успешно!</h1>
        <p class="success-text">
            Спасибо за покупку! Осталось активировать ваш тариф.
        </p>

        <div class="next-steps">
            <h3>Следующие шаги:</h3>
            <ol>
                <li>Напишите нам в Telegram</li>
                <li>Укажите ваш email на сайте</li>
                <li>Приложите скриншот оплаты</li>
                <li>Получите активацию в течение 1 часа</li>
            </ol>
        </div>

        <a href="https://t.me/ParsersaasBot" class="telegram-btn">
            <svg viewBox="0 0 24 24"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 8.161c-.18 1.897-.962 6.502-1.359 8.627-.168.9-.5 1.201-.82 1.23-.697.064-1.226-.461-1.901-.903-1.056-.692-1.653-1.123-2.678-1.799-1.185-.781-.417-1.21.258-1.911.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.139-5.062 3.345-.479.329-.913.489-1.302.481-.428-.009-1.252-.242-1.865-.442-.751-.244-1.349-.374-1.297-.789.027-.216.324-.437.893-.663 3.498-1.524 5.831-2.529 6.998-3.015 3.333-1.386 4.025-1.627 4.477-1.635.099-.002.321.023.465.141.121.1.155.234.17.332.015.098.034.322.019.496z"/></svg>
            Написать в Telegram
        </a>

        <a href="index.html" class="home-link">← Вернуться на главную</a>
    </div>
</body>
</html>
